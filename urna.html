<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
  <style>
        body {
            background-color: #ddd;
            font-family: Arial;
        }

        .urna {
            width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: #eee;
            border: 2px solid black;
        }

        .tela {
            background-color: #ccc;
            border: 3px solid black;
            padding: 30px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
        }

        .candidato {
            background-color: white;
            border: 2px solid black;
            padding: 15px;
            margin: 10px 0;
        }

        .numero {
            font-size: 25px;
            font-weight: bold;
        }

        .botoes {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            font-weight: bold;
        }

        .branco {
            background-color: white;
        }

        .corrige {
            background-color: orange;
        }

        .confirma {
            background-color: green;
            color: white;
        }
    </style>
<body>
     <div class="urna">

        <h1>URNA ELETRÔNICA</h1>

        <div class="tela">

            <h2>Presidente</h2>

            <div class="candidato">
                <input type="radio" name="presidente">
                10 - Marin Kitagawa
            </div>

            <p>Selecione o candidato:</p>

        </div>

        <div class="botoes">
            <button class="branco">BRANCO</button>
            <button class="corrige">CORRIGE</button>
            <button class="confirma">CONFIRMA</button>
        </div>


        <div class="tela">

            <h2>Governador</h2>

            <div class="candidato">
                <input type="radio" name="governador">
                20 - Sebastian Michaelis
            </div>

            <p>Selecione o candidato:</p>

        </div>

        <div class="botoes">
            <button class="branco">BRANCO</button>
            <button class="corrige">CORRIGE</button>
            <button class="confirma">CONFIRMA</button>
        </div>

    </div>
</body>
</html>
